name: Build & Deploy Web to AWS

on:
  push:
    branches: [ main ]
    # Only the frontend is deployed; backend changes should not trigger a web deploy.
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-aws.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# A second push while a deploy is mid-flight would race on S3 and CloudFront.
concurrency:
  group: deploy-aws
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        # The Vite app lives in frontend/, not the repo root.
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `npm run build` runs `tsc -b` first, so a type error fails the deploy
      # rather than shipping a broken bundle.
      - name: Build Vite web app
        run: npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Only assets/ carries content-hashed filenames, so only it is safe to
      # cache forever. Root-level files are handled in the steps below.
      - name: Sync hashed assets to S3 (long cache)
        run: |
          aws s3 sync dist/assets/ "s3://${{ vars.S3_BUCKET }}/assets/" \
            --delete \
            --cache-control "public, max-age=31536000, immutable"

      # index.html must never be cached, or clients keep loading the old bundle.
      - name: Upload index.html (no-cache)
        run: |
          aws s3 cp dist/index.html "s3://${{ vars.S3_BUCKET }}/index.html" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html"

      # Root-level assets (favicons, icons) keep their real filenames, so they
      # get a short cache and are discovered rather than listed by name — a new
      # icon should not need a workflow edit.
      - name: Upload unhashed root assets (short cache)
        run: |
          find dist -maxdepth 1 -type f ! -name 'index.html' -print0 |
            while IFS= read -r -d '' file; do
              aws s3 cp "$file" "s3://${{ vars.S3_BUCKET }}/$(basename "$file")" \
                --cache-control "public, max-age=86400"
            done

      # assets/ was synced with --delete above; this prunes stale root-level
      # files (a renamed favicon, say) without touching the hashed bundles.
      - name: Prune removed root assets
        run: |
          aws s3 sync dist/ "s3://${{ vars.S3_BUCKET }}/" \
            --delete \
            --exclude "assets/*" \
            --cache-control "public, max-age=86400"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
