name: Build & Deploy Web to AWS

on:
  push:
    branches: [ main ]
    # Only the frontend is deployed; backend changes should not trigger a web deploy.
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-aws.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# A second push while a deploy is mid-flight would race on S3 and CloudFront.
concurrency:
  group: deploy-aws
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        # The Vite app lives in frontend/, not the repo root.
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `npm run build` runs `tsc -b` first, so a type error fails the deploy
      # rather than shipping a broken bundle.
      - name: Build Vite web app
        run: npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Hashed filenames under assets/ can cache forever; a new build produces
      # new names. Everything at the root is excluded and handled below.
      - name: Sync hashed assets to S3 (long cache)
        run: |
          aws s3 sync dist/ "s3://${{ vars.S3_BUCKET }}/" \
            --delete \
            --exclude "index.html" \
            --exclude "favicon.svg" \
            --exclude "icons.svg" \
            --cache-control "public, max-age=31536000, immutable"

      # index.html must never be cached, or clients keep loading the old bundle.
      - name: Upload index.html (no-cache)
        run: |
          aws s3 cp dist/index.html "s3://${{ vars.S3_BUCKET }}/index.html" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html"

      - name: Upload unhashed SVG assets (short cache)
        run: |
          for asset in favicon.svg icons.svg; do
            if [ -f "dist/$asset" ]; then
              aws s3 cp "dist/$asset" "s3://${{ vars.S3_BUCKET }}/$asset" \
                --cache-control "public, max-age=86400" \
                --content-type "image/svg+xml"
            fi
          done

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
